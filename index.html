<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Otonom Proses Planlama | CANIAS ERP</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        :root { 
            --primary-color: #2c3e50; --secondary-color: #34495e; 
            --accent-color: #27ae60; --bg-color: #ecf0f1; --box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); padding: 15px; margin: 0; color: var(--primary-color); }
        
        /* GİRİŞ EKRANI STİLİ */
        .login-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: var(--primary-color); z-index: 99999; display: flex; justify-content: center; align-items: center; }
        .login-box { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); text-align: center; width: 300px; }
        .login-box h2 { margin-top: 0; color: var(--primary-color); }
        
        .header { text-align: center; margin-bottom: 20px; position: relative;}
        .action-buttons { position: absolute; right: 20px; top: 10px; display: flex; gap: 10px; }
        .btn { color: white; border: none; padding: 10px 20px; font-size: 15px; font-weight: bold; border-radius: 8px; cursor: pointer; display: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: 0.3s; }
        .btn-print { background-color: var(--primary-color); }
        .btn-excel { background-color: #217346; } 
        .btn-edit { background-color: #f39c12; }
        
        .memory-btn { position: absolute; left: 20px; top: 10px; background-color: #8e44ad; color: white; border: none; padding: 10px 20px; font-size: 15px; font-weight: bold; border-radius: 8px; cursor: pointer; display: none;}
        .archive-btn { position: absolute; left: 195px; top: 10px; background-color: #34495e; color: white; border: none; padding: 10px 20px; font-size: 15px; font-weight: bold; border-radius: 8px; cursor: pointer; display: none;}
        
        .archive-list { max-height: 450px; overflow-y: auto; text-align: left; margin-top: 15px; padding-right: 10px;}
        .archive-item { background: #f8f9fa; border-left: 4px solid var(--primary-color); padding: 10px 15px; margin-bottom: 12px; border-radius: 6px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); transition: 0.2s; display: flex; gap: 15px; align-items: center;}
        .archive-thumb { width: 70px; height: 70px; object-fit: contain; border-radius: 4px; border: 1px solid #bdc3c7; background: white; flex-shrink: 0;}
        .archive-content { flex-grow: 1; overflow: hidden;}
        .archive-date { font-size: 11px; color: #7f8c8d; margin-bottom: 3px; }
        .archive-header-text { display: flex; justify-content: space-between; font-weight: bold; color: var(--primary-color); margin-bottom: 3px; font-size: 14px;}
        .archive-desc { font-size: 12px; color: #34495e; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
        .archive-ops { font-size: 12px; color: #e67e22; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}

        .main-wrapper { max-width: 98%; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
        .top-container { display: flex; gap: 20px; align-items: stretch; }
        .panel { background: white; padding: 20px; border-radius: 12px; box-shadow: var(--box-shadow); display: flex; flex-direction: column; }
        .col-left { flex: 0 0 30%; } .col-mid { flex: 0 0 45%; overflow-x: auto; } .col-right { flex: 1; }      
        .bottom-container { background: white; padding: 20px; border-radius: 12px; box-shadow: var(--box-shadow); text-align: center; }

        .drop-zone { border: 2px dashed #bdc3c7; border-radius: 8px; padding: 15px; text-align: center; color: #95a5a6; cursor: pointer; margin-bottom: 15px; background: #f8f9fa;}
        #previewContainer { flex-grow: 1; border: 1px solid #ddd; border-radius: 8px; overflow: hidden; display: none; background: #333; min-height: 600px; display: flex; align-items: center; justify-content: center;}
        #previewContainer img, #previewContainer iframe { width: 100%; height: 100%; object-fit: contain; }
        
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: var(--primary-color); color: white; white-space: nowrap;}
        
        .editable-cell { background-color: #fff9c4 !important; border: 1px dashed #f39c12 !important; }
        
        .timeline { margin-top: 10px; padding-left: 20px; border-left: 3px solid var(--accent-color); }
        .timeline-item { position: relative; margin-bottom: 25px; padding-left: 20px; }
        .timeline-item::before { content: ''; position: absolute; left: -28px; top: 0; width: 14px; height: 14px; border-radius: 50%; background: var(--accent-color); border: 4px solid white; box-shadow: 0 0 0 2px var(--accent-color); }
        .timeline-title { font-weight: bold; color: var(--primary-color); font-size: 16px; margin-bottom: 5px;}
        .timeline-desc { font-size: 13px; color: #34495e; font-style: italic; margin-bottom: 4px;}
        .timeline-long-desc { font-size: 13px; color: #7f8c8d; }
        .timeline-badge { display: inline-block; background: #f39c12; color: white; padding: 2px 8px; border-radius: 12px; font-size: 11px; margin-top: 5px; font-weight: bold;}

        .tree-wrapper { display: flex; flex-direction: column; align-items: center; padding: 20px 0; }
        .tree-node { background: var(--primary-color); color: white; padding: 12px 25px; border-radius: 8px; border: 2px solid #1abc9c; min-width: 250px; text-align: center; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1);}
        .tree-node.raw { background: #e67e22; border-color: #d35400; }
        .tree-node.final { background: var(--accent-color); border-color: #2ecc71; font-size: 18px; padding: 15px 30px;}
        .tree-line { width: 3px; height: 30px; background: #bdc3c7; }

        .loader { display: none; border: 5px solid #f3f3f3; border-top: 5px solid var(--accent-color); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.6); z-index: 9999; justify-content: center; align-items: center; backdrop-filter: blur(3px); }
        .modal-content { background: white; padding: 30px; border-radius: 12px; width: 500px; max-width: 90%; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .modal-input { width: 90%; padding: 12px; border: 2px solid #bdc3c7; border-radius: 8px; font-size: 16px; margin: 15px 0; font-weight: bold; text-align: center; outline: none;}
        .modal-btn { background: var(--accent-color); color: white; border: none; padding: 12px 25px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; font-size: 16px; margin-top: 10px;}
        
        .memory-textarea { width: 100%; height: 150px; padding: 10px; border: 2px solid #9b59b6; border-radius: 8px; resize: vertical; font-family: monospace;}
        .memory-visual-board { width: 100%; height: 100px; border: 2px dashed #bdc3c7; border-radius: 8px; margin-top: 15px; display: flex; justify-content: center; align-items: center; overflow: hidden; position: relative;}
        .memory-visual-board img { max-width: 100%; max-height: 100%; }
    </style>
</head>
<body>

    <div class="login-overlay" id="loginOverlay">
        <div class="login-box">
            <h2>BM MADEN - Giriş</h2>
            <input type="text" id="username" class="modal-input" placeholder="Kullanıcı Adı">
            <input type="password" id="password" class="modal-input" placeholder="Şifre">
            <button class="modal-btn" onclick="checkLogin()">GİRİŞ YAP</button>
        </div>
    </div>

    <div class="modal-overlay" id="archiveModal">
        <div class="modal-content" style="width: 650px;">
            <h2 style="margin-top:0; color:var(--primary-color);">🗄️ Geçmiş Analiz Arşivi</h2>
            <div class="archive-list" id="archiveList"></div>
            <div style="display:flex; gap:10px; margin-top:15px;">
                <button class="modal-btn" style="background-color: #bdc3c7; color: #333;" onclick="document.getElementById('archiveModal').style.display='none'">Kapat</button>
                <button class="modal-btn" style="background-color: #e74c3c;" onclick="clearArchive()">🗑️ Temizle</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="memoryModal">
        <div class="modal-content" style="width: 600px;">
            <h2 style="margin-top:0; color:#8e44ad;">🧠 BM MADEN Şirket Hafızası</h2>
            <textarea id="memoryInput" class="memory-textarea" placeholder="Kurallarınızı buraya yazın..."></textarea>
            <div id="visualBoard" class="memory-visual-board" contenteditable="true"><span>Görsel yapıştır (Ctrl+V)</span></div>
            <button class="modal-btn" style="background-color: #8e44ad;" onclick="saveMemory()">💾 Kaydet</button>
            <button class="modal-btn" style="background-color: #bdc3c7; color: #333;" onclick="document.getElementById('memoryModal').style.display='none'">İptal</button>
        </div>
    </div>

    <div class="modal-overlay" id="variantModal">
        <div class="modal-content">
            <h2 style="margin-top:0; color:var(--primary-color);">Tablolu Resim</h2>
            <input type="text" id="variantInput" class="modal-input" placeholder="Hedef Kod">
            <button class="modal-btn" onclick="startAnalysis()">🚀 Başlat</button>
        </div>
    </div>

    <div class="header">
        <button class="memory-btn" id="memBtn" onclick="openMemoryModal()">🧠 Hafıza</button>
        <button class="archive-btn" id="arcBtn" onclick="openArchiveModal()">🗄️ Arşiv</button>
        <h1>CANIAS Otonom Proses Planlama</h1>
        <div class="action-buttons">
            <button id="editBtn" class="btn btn-edit" onclick="toggleEdit()">✏️ Düzenle</button>
            <button id="excelBtn" class="btn btn-excel" onclick="excelIndir()">📊 Excel</button>
            <button id="printBtn" class="btn btn-print" onclick="window.print()">🖨️ PDF</button>
        </div>
    </div>

    <div class="main-wrapper">
        <div class="top-container">
            <div class="panel col-left">
                <div class="drop-zone" id="dropZone"><p>Dosya Yükle</p><input type="file" id="fileInput" accept=".pdf, .png, .jpg, .jpeg"></div>
                <div id="previewContainer"></div>
                <div class="loader" id="loader"></div>
                <p id="statusMessage" style="text-align: center; font-weight: bold;"></p>
            </div>
            
            <div class="panel col-mid">
                <h3>Operasyon Rota (ROUT01)</h3>
                <div style="overflow-x:auto;">
                    <table>
                        <thead><tr><th>KOD</th><th>KISA</th><th>UZUN</th><th>BRÜT</th><th>NET</th><th>FİRE</th><th>SÜRE</th></tr></thead>
                        <tbody id="tableBody"></tbody>
                        <tfoot id="tableFoot"></tfoot>
                    </table>
                </div>
            </div>
            
            <div class="panel col-right">
                <h3>Görsel Akış</h3>
                <div class="timeline" id="timelineContainer"></div>
            </div>
        </div>
        <div class="bottom-container">
            <h3>Ürün Ağacı (BOMT01)</h3>
            <div class="tree-wrapper" id="treeContainer"></div>
        </div>
    </div>

    <script>
        // GİRİŞ KONTROLÜ
        function checkLogin() {
            const u = document.getElementById('username').value.toUpperCase();
            const p = document.getElementById('password').value.toUpperCase();
            if ((u === "CAGLAR" && p === "CAGLAR") || (u === "TUNC" && p === "TUNC")) {
                document.getElementById('loginOverlay').style.display = 'none';
                sessionStorage.setItem('isLoggedIn', 'true');
                showControls();
            } else {
                alert("Hatalı Giriş!");
            }
        }

        function showControls() {
            document.getElementById('memBtn').style.display = "block";
            document.getElementById('arcBtn').style.display = "block";
            document.getElementById('editBtn').style.display = "inline-block";
            document.getElementById('excelBtn').style.display = "inline-block";
            document.getElementById('printBtn').style.display = "inline-block";
        }

        if (sessionStorage.getItem('isLoggedIn') === 'true') {
            document.getElementById('loginOverlay').style.display = 'none';
            showControls();
        }

        // --- DİĞER FONKSİYONLAR (Arşiv, Hafıza, API) ---
        function saveToArchive(kodu, aciklama, sure, prosesler, base64Thumb) {
            let archive = JSON.parse(localStorage.getItem('bm_archive') || '[]');
            let ops = prosesler.map(p => p.canias_kodu ? p.canias_kodu.substring(0,2) : "OP").join(" ➔ ");
            let now = new Date();
            let dateStr = now.toLocaleDateString('tr-TR') + " " + now.toLocaleTimeString('tr-TR');
            archive.unshift({ tarih: dateStr, kodu: kodu, aciklama: aciklama, sure: sure.toFixed(1), ops: ops, thumb: base64Thumb });
            if(archive.length > 50) archive.pop(); 
            localStorage.setItem('bm_archive', JSON.stringify(archive));
        }

        function openArchiveModal() {
            let archive = JSON.parse(localStorage.getItem('bm_archive') || '[]');
            let listDiv = document.getElementById('archiveList');
            listDiv.innerHTML = archive.length === 0 ? "<p style='text-align:center;'>Kayıt yok.</p>" : "";
            archive.forEach(item => {
                let thumbHtml = item.thumb ? `<img src="data:image/jpeg;base64,${item.thumb}" class="archive-thumb">` : `<div class="archive-thumb">YOK</div>`;
                listDiv.innerHTML += `<div class="archive-item">${thumbHtml}<div class="archive-content"><div class="archive-header-text"><span>${item.kodu}</span><span>⏱️${item.sure} Dk</span></div><div class="archive-desc">${item.aciklama}</div><div class="archive-ops">${item.ops}</div></div></div>`;
            });
            document.getElementById('archiveModal').style.display = 'flex';
        }

        function clearArchive() { if(confirm("Temizle?")) { localStorage.removeItem('bm_archive'); openArchiveModal(); } }

        window.onload = () => {
            const savedMemory = localStorage.getItem('bm_company_memory');
            if (savedMemory) document.getElementById('memoryInput').value = savedMemory;
        };

        function openMemoryModal() { document.getElementById('memoryModal').style.display = 'flex'; }
        function saveMemory() {
            localStorage.setItem('bm_company_memory', document.getElementById('memoryInput').value);
            document.getElementById('memoryModal').style.display = 'none';
        }

        document.getElementById('visualBoard').addEventListener('paste', (e) => {
            e.preventDefault();
            const item = e.clipboardData.items[0];
            if (item.kind === 'file') {
                const reader = new FileReader();
                reader.onload = (event) => { document.getElementById('visualBoard').innerHTML = `<img src="${event.target.result}">`; };
                reader.readAsDataURL(item.getAsFile());
            }
        });

        // Diğer fonksiyonlar (ApiyeGonder, ToggleEdit vb.) aynen devam edebilir...
        // Kod çok uzun olmasın diye buraya özetini koydum, önceki kodunuzdaki fonksiyonları buraya yapıştırın.
    </script>
</body>
</html>
